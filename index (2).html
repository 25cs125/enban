
<!DOCTYPE html>
<html>
<head>
    <title>SKCET Sign In</title>

    <style>
        body {
            margin: 0;
            font-family: Arial;
            background-color: #f5f5ff;
        }

        .header {
            background-color: blueviolet;
            color: white;
            padding: 25px;
            font-size: 22px;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 300px auto 0;
            background-color: white;
            text-align: center;
        }

        .banner {
            width: 100%;
            height: 180px;
            object-fit: cover;
        }

        .form {
            padding: 30px;
        }

        h3 {
            font-size: 16px;
        }

        p {
            font-size: 13px;
        }

        input {
            width: 80%;
            padding: 10px;
            margin: 10px;
        }

        button {
            width: 84%;
            padding: 10px;
            background-color: blue;
            color: white;
            border: none;
            cursor: pointer;
        }

        a {
            display: block;
            margin: 15px;
            color: blue;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="header">
        SKCET<br>
        placement.skcet.ac.in
    </div>

    <div class="container">

        <img class="banner"
        src="https://images.unsplash.com/photo-1523050854058-8df90110c9f1"
        alt="Graduation">

        <div class="form">

            <h4>SRI KRISHNA INSTITUTIONS</h4>

            <h3>
                Sri Krishna College of Engineering and Technology
            </h3>

            <h4>Sign In</h4>

            <p>The key to happiness is to sign in.</p>

            <form onsubmit="login(event)">

                <label>Email</label><br>

                <input type="email" id="email" required>

                <br><br>

                <button type="submit">Next</button>

            </form>

            <a href="#">System Compatibility Check?</a>

        </div>

    </div>

    <script>
        function login(event) {
            event.preventDefault();

            let email = document.getElementById("email").value;

            alert("Email: " + email);
        }
    </script>

</body>
</html>
